# 從 repo 根目錄部署：flyctl deploy . --config CompanyAPP/fly.toml --dockerfile Dockerfile
# 映像由根目錄 Dockerfile 建置（Node 22 + .NET 9）。
#

app = "companyapp-luyu"
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[env]
  ASPNETCORE_URLS = "http://+:8080"
  DATABASE_PATH = "/data/company.db"
  AppSettings__FrontendUrl = "https://companyapp-luyu.fly.dev"

  [[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "companyapp_data"
  destination = "/data"