name: .NET 9 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore, build and test
        run: |
          dotnet restore CompanyAPP.sln
          dotnet build CompanyAPP.sln --no-restore --configuration Release
          dotnet test CompanyAPP.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

  sonar:
    name: SonarCloud (optional)
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip when token missing
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN not set; skip SonarCloud."

      - uses: actions/checkout@v5
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - name: Setup .NET
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Analyze
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin /k:"sachiellu_CompanyAPP" /o:"sachiellu" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          dotnet restore CompanyAPP.sln
          dotnet build CompanyAPP.sln --no-restore --configuration Release
          dotnet test CompanyAPP.sln --no-build --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  deploy-qa:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_QA }}
    steps:
      - name: Detect Fly token
        id: fly
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN_QA is not set; skip QA deploy."
          fi

      - uses: actions/checkout@v5
        if: steps.fly.outputs.enabled == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.enabled == 'true'

      - name: Deploy to Fly.io (QA)
        if: steps.fly.outputs.enabled == 'true'
        continue-on-error: true
        working-directory: ./CompanyAPP
        run: flyctl deploy --remote-only -a companyapp-qa
