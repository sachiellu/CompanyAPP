name: .NET 9 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore, build and test
        run: |
          dotnet restore CompanyAPP.sln
          dotnet build CompanyAPP.sln --no-restore --configuration Release
          dotnet test CompanyAPP.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

  sonar:
    name: SonarCloud
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Require SONAR_TOKEN
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "GitHub Secret SONAR_TOKEN 是空的。"
            echo "到 https://sonarcloud.io/account/security 產生 token，"
            echo "再貼到 https://github.com/sachiellu/CompanyAPP/settings/secrets/actions"
            exit 1
          fi
          echo "SONAR_TOKEN 長度: ${#SONAR_TOKEN}"
          echo "SONAR_TOKEN 前綴: ${SONAR_TOKEN:0:4}"
          case "$SONAR_TOKEN" in
            FlyV1*|fo1_*)
              echo "SONAR_TOKEN 貼成 Fly 令牌了。這裡只能貼 SonarCloud 的 token。"
              exit 1
              ;;
            ghp_*|github_pat_*|gho_*|ghu_*)
              echo "SONAR_TOKEN 貼成 GitHub PAT 了。要貼 SonarCloud Access tokens 頁產生的那一把。"
              exit 1
              ;;
            squ_*|sqp_*|sqa_*|sqo_*)
              echo "SONAR_TOKEN 前綴看起來是 SonarCloud。"
              ;;
            *)
              echo "前綴不是 squ_/sqp_。若等下 API 驗證失敗，到同一個 SonarCloud 帳號重產 Personal Token。"
              ;;
          esac
          auth_code=$(curl -sS -o /tmp/sonar-auth.json -w "%{http_code}" \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarcloud.io/api/authentication/validate")
          echo "authentication/validate HTTP ${auth_code}"
          cat /tmp/sonar-auth.json; echo
          org_code=$(curl -sS -o /tmp/sonar-org.json -w "%{http_code}" \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarcloud.io/api/organizations/search?organizations=sachiellu")
          echo "organizations/search?organizations=sachiellu HTTP ${org_code}"
          cat /tmp/sonar-org.json; echo
          if [ "$auth_code" != "200" ] || ! grep -q '"valid":true' /tmp/sonar-auth.json; then
            echo "GitHub 有 SONAR_TOKEN，但 SonarCloud 不認這把（帳號不符、複製不完整、或產生後沒整段貼上）。"
            echo "到 https://sonarcloud.io/account/security 用「綁 GitHub 的同一個帳號」重產，立刻整段貼到 GitHub Secret SONAR_TOKEN。"
            exit 1
          fi
          if ! grep -q '"key":"sachiellu"' /tmp/sonar-org.json; then
            echo "這把 token 登入成功，但看不到組織 key=sachiellu。"
            echo "到 https://sonarcloud.io/account/organizations 看實際 Key（不是顯示名稱 呂紹瑜），必須跟 workflow 的 sachiellu 一模一樣。"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Analyze and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"sachiellu_CompanyAPP" \
            /n:"CompanyAPP" \
            /o:"sachiellu" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.apiBaseUrl="https://api.sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=false
          dotnet restore CompanyAPP.sln
          dotnet build CompanyAPP.sln --no-restore --configuration Release
          dotnet test CompanyAPP.sln --no-build --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  deploy-qa:
    name: Deploy QA (companyapp-qa)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_QA }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
    steps:
      - name: Require FLY_API_TOKEN_QA
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "GitHub Secret FLY_API_TOKEN_QA 是空的。"
            echo "到 https://fly.io/dashboard 產生 token 後貼到 GitHub Secrets。"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install flyctl
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL https://fly.io/install.sh | sh; then
              echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "flyctl 安裝失敗（常見是 Fly/GitHub 504），第 ${i} 次，稍候重試"
            sleep $((i * 8))
          done
          echo "flyctl 安裝連續失敗，這是 Fly 下載端暫時 504，不是 QA token 或 companyapp-qa 設定錯。"
          exit 1

      - name: Create QA app if missing, then deploy
        run: |
          set -euo pipefail
          flyctl auth whoami
          if flyctl secrets list -a companyapp-qa 2>/dev/null | grep -q JwtSettings__Key; then
            echo "Fly QA 已有 JwtSettings__Key"
          elif [ -n "${JWT_KEY:-}" ]; then
            flyctl secrets set JwtSettings__Key="$JWT_KEY" -a companyapp-qa
          else
            echo "QA 缺少 JwtSettings__Key。在 GitHub Secrets 新增 JWT_KEY，或先執行："
            echo "fly secrets set JwtSettings__Key=\"金鑰\" -a companyapp-qa"
            exit 1
          fi
          if ! flyctl status -a companyapp-qa >/dev/null 2>&1; then
            echo "companyapp-qa 不存在，以 org personal 重建"
            flyctl apps create companyapp-qa --org personal
            flyctl volumes create companyapp_qa_data --region sin --size 1 --yes -a companyapp-qa
          fi
          flyctl deploy . --config CompanyAPP/fly.qa.toml --dockerfile Dockerfile --remote-only -a companyapp-qa

  deploy-prod:
    name: Deploy Prod (companyapp-luyu)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
    steps:
      - name: Require FLY_API_TOKEN
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "GitHub Secret FLY_API_TOKEN 是空的。"
            echo "這是正式站 companyapp-luyu 的 deploy token，不是 FLY_API_TOKEN_QA。"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install flyctl
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL https://fly.io/install.sh | sh; then
              echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "flyctl 安裝失敗（常見是 Fly/GitHub 504），第 ${i} 次，稍候重試"
            sleep $((i * 8))
          done
          echo "flyctl 安裝連續失敗，這是 Fly 下載端暫時 504，不是正式站 token 或 companyapp-luyu 設定錯。"
          exit 1

      - name: Deploy production
        run: |
          set -euo pipefail
          flyctl auth whoami
          flyctl status -a companyapp-luyu
          if flyctl secrets list -a companyapp-luyu 2>/dev/null | grep -q JwtSettings__Key; then
            echo "Fly 正式站已有 JwtSettings__Key"
          elif [ -n "${JWT_KEY:-}" ]; then
            flyctl secrets set JwtSettings__Key="$JWT_KEY" -a companyapp-luyu
          else
            echo "正式站缺少 JwtSettings__Key。在 GitHub Secrets 新增 JWT_KEY，或先執行："
            echo "fly secrets set JwtSettings__Key=\"金鑰\" -a companyapp-luyu"
            exit 1
          fi
          flyctl deploy . --config CompanyAPP/fly.toml --dockerfile Dockerfile --remote-only -a companyapp-luyu
