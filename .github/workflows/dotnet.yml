name: .NET 9 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect SonarCloud token
        id: sonar
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not set; skip SonarCloud so build/test can still pass."
          fi

      - name: Set up JDK 17
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install SonarCloud scanner
        if: steps.sonar.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        if: steps.sonar.outputs.enabled == 'true'
        run: >
          dotnet sonarscanner begin
          /k:"sachiellu_CompanyAPP"
          /o:"sachiellu"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: Restore, build and test
        run: |
          dotnet restore CompanyAPP.sln
          dotnet build CompanyAPP.sln --no-restore --configuration Release
          dotnet test CompanyAPP.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        if: steps.sonar.outputs.enabled == 'true'
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  deploy-qa:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_QA }}
    steps:
      - name: Detect Fly token
        id: fly
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN_QA is not set; skip QA deploy so CI can stay green."
          fi

      - uses: actions/checkout@v5
        if: steps.fly.outputs.enabled == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.enabled == 'true'

      - name: Deploy to Fly.io (QA)
        if: steps.fly.outputs.enabled == 'true'
        working-directory: ./CompanyAPP
        run: flyctl deploy --remote-only -a companyapp-qa
